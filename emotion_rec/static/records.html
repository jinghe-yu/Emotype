<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-ui-copy="历史记录 | EmoBridge">Records | EmoBridge</title>
  <link rel="stylesheet" href="/static/styles.css?v=20261010c" />
  <link rel="stylesheet" href="/static/records.css?v=20261010a" />
</head>
<body class="records-page">
<main class="app-shell records-shell">
  <header class="topbar records-topbar">
    <a class="brand-mark" href="/" aria-label="EmoBridge home" data-ui-aria-label="EmoBridge 首页">
      <img class="brand-icon2" src="/static/icon2-only.png" alt="" aria-hidden="true" />
      <img class="brand-name-img" src="/static/name-text.png" alt="emobridge" />
    </a>

    <nav class="view-tabs" aria-label="Primary navigation">
      <a class="tab-button" href="/" data-ui-copy="首页">Home</a>
      <a class="tab-button" href="/essay" data-ui-copy="情绪随笔">Journal</a>
      <a class="tab-button" href="/body-sensation" data-ui-copy="身体感受">Body Sensation</a>
      <a class="tab-button" href="/emo-echo" data-ui-copy="Emo 回响">Emo Echo</a>
      <a class="tab-button is-active" href="/historyreview" aria-current="page" data-ui-copy="历史回顾">History</a>
    </nav>

    <div class="topbar-right">
    </div>
  </header>

  <section class="records-heading" aria-labelledby="recordsTitle">
    <div>
      <p class="eyebrow">My Records</p>
      <h1 id="recordsTitle" data-ui-copy="我的历史记录">My records</h1>
      <p data-ui-copy="这里仅读取已经保存过的随手记、正式日记和身体感受，不会在打开页面时调用模型。">Only saved Journal, Diary and Body Sense records are shown. Opening this page does not call the model.</p>
    </div>
    <div class="records-filters">
      <label class="records-control" for="recordsStartDate">
        <span data-ui-copy="开始">Start</span>
        <input id="recordsStartDate" type="date" />
      </label>
      <label class="records-control" for="recordsEndDate">
        <span data-ui-copy="结束">End</span>
        <input id="recordsEndDate" type="date" />
      </label>
      <label class="records-control" for="recordsSource">
        <span data-ui-copy="类型">Type</span>
        <select id="recordsSource">
          <option value="all" data-ui-copy="全部">All</option>
          <option value="journal" data-ui-copy="Journal 随手记">Journal</option>
          <option value="diary" data-ui-copy="Diary 正式日记">Diary</option>
          <option value="body_sensation" data-ui-copy="Body 身体感受">Body Sense</option>
        </select>
      </label>
      <button class="warm-btn primary" type="button" id="recordsLoadBtn" data-ui-copy="查看记录">View records</button>
    </div>
  </section>

  <section class="records-summary-grid" aria-label="Records overview" data-ui-aria-label="历史记录概览">
    <article class="records-stat">
      <span data-ui-copy="总记录">Total records</span>
      <strong id="recordsTotal">0</strong>
      <small id="recordsState" data-ui-copy="载入中">Loading</small>
    </article>
    <article class="records-stat">
      <span data-ui-copy="随手记">Journal</span>
      <strong id="recordsJournalCount">0</strong>
      <small>Journal</small>
    </article>
    <article class="records-stat">
      <span data-ui-copy="正式日记">Diary</span>
      <strong id="recordsDiaryCount">0</strong>
      <small>Diary</small>
    </article>
    <article class="records-stat">
      <span data-ui-copy="身体感受">Body Sensation</span>
      <strong id="recordsBodyCount">0</strong>
      <small>Body</small>
    </article>
  </section>

  <section class="records-list-panel" aria-labelledby="recordsListTitle">
    <div class="records-panel-head">
      <div>
        <p class="eyebrow" data-i18n="records.eyebrow">Timeline</p>
        <h2 id="recordsListTitle" data-ui-copy="记录列表">Record list</h2>
      </div>
    </div>
    <div class="records-list" id="recordsList"></div>
  </section>
</main>
<script src="/static/records.js?v=20261010a" defer></script>
<script src="/static/i18n.js?v=20261010c"></script>
<script src="/static/auth.js?v=20261010c"></script>
</body>
</html>
